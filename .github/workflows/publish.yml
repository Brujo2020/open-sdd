# Publish the public package.
#
# The repository has two manifests and only one of them is publishable:
#
#   package.json                -> @brujo2020/open-sdd  (the artifact users install)
#   tools/open-sdd/package.json   -> the build toolchain, marked "private": true
#
# Publishing ran from `tools/open-sdd` before the rename, which would have shipped an unscoped
# `open-sdd` instead of the scoped package. It now builds and tests the workspace, then publishes
# from the repository root, where `files` collects tools/open-sdd/dist and the agent templates.
#
# Scoped packages default to private on npm, so `--access public` is explicit here and mirrored by
# `publishConfig.access` in package.json. Provenance is requested through OIDC.

name: Publish Package

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v3.0.2
  workflow_dispatch:

permissions:
  id-token: write  # Required for OIDC provenance
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace
        working-directory: tools/open-sdd
        run: npm ci

      - name: Build
        working-directory: tools/open-sdd
        run: npm run build

      - name: Test suite (a red suite blocks the release)
        working-directory: tools/open-sdd
        run: npm test

      - name: Verify the gate chain on the release tree
        run: node tools/open-sdd/dist/cli.js gates run

      - name: Verify the claims registry
        run: node tools/open-sdd/dist/cli.js assure claims --verify

      - name: Confirm the published identity
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME:-manual}"
          echo "publishing $NAME@$VERSION (ref: $TAG)"
          test "$NAME" = "@brujo2020/open-sdd"

      - name: Publish
        run: npm publish --access public --provenance
