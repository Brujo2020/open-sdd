# open-sdd | the merge boundary (enforcement level C) for this repository.
#
# Level C is the half of the floor that asks no vendor's permission and cannot be silently
# withdrawn: CI runs the full declared gate chain on every pull request. Together with the
# pre-commit hook (level B, `tools/open-sdd/templates/hooks/pre-commit`) it makes the guarantee
# checkable instead of declared — see `open-sdd floor status` and gap G-11 in
# docs/PAPER-ALIGNMENT.md.
#
# The chain runs against the PULL REQUEST DIFF via `--base`. A gate run that inspects nothing is
# activation without measurement, and a green badge over an empty scan is precisely the false
# assurance this architecture exists to prevent.

name: gates

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # Required by the SARIF upload step below. The gate chain itself only needs contents: read.
  security-events: write

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `--base` diffs against the base commit, which needs the full history.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace
        working-directory: tools/open-sdd
        run: npm ci

      - name: Build
        working-directory: tools/open-sdd
        run: npm run build

      - name: Test suite
        working-directory: tools/open-sdd
        run: npm test

      - name: Install the commit gate (level B)
        run: npm run hooks:install

      - name: Resolve the declared gate chain
        run: node tools/open-sdd/dist/cli.js gates chain --profile regulated

      - name: Run the gate chain against the change
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          node tools/open-sdd/dist/cli.js gates run --base "$BASE"

      - name: Decision discipline (decidable properties)
        run: node tools/open-sdd/dist/cli.js govern discipline
        continue-on-error: true

      - name: Enforce the declared rigor level (the constitution is required from Spec-Anchored)
        run: node tools/open-sdd/dist/cli.js govern rigor

      - name: Validate the delta spec, when the change declares one
        run: |
          for spec in .sdd/specs/*/delta.md; do
            [ -f "$spec" ] || continue
            feature="$(basename "$(dirname "$spec")")"
            node tools/open-sdd/dist/cli.js delta validate "$feature"
          done

      - name: Execution contracts — a declared contract that does not exist fails the build
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then BASE="HEAD~1"; fi
          for spec in .sdd/specs/*/delta.md; do
            [ -f "$spec" ] || continue
            feature="$(basename "$(dirname "$spec")")"
            node tools/open-sdd/dist/cli.js brownfield contracts "$feature" --base "$BASE"
          done

      - name: Claims registry (§9.6) — a broken claim fails the build
        run: node tools/open-sdd/dist/cli.js assure claims --verify

      # The evidence bundle an auditor reads: constitution, specs, gates, claims, alignment and
      # rigor, with one sha256 per artifact in manifest.json (REQ-MAT-006). It exits 1 on a gate
      # FAIL or a broken claim and 2 when the audit could not run, so it fails the job like any
      # other gate. The SARIF report (REQ-MAT-007) is the same verdict for code scanning.
      - name: Audit evidence bundle with one sha256 per artifact
        run: |
          node tools/open-sdd/dist/cli.js audit bundle \
            --out .sdd/audit/ci \
            --sarif .sdd/audit/open-sdd.sarif

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: open-sdd-audit-bundle
          path: .sdd/audit/ci
          if-no-files-found: warn
          retention-days: 30

      - name: Upload SARIF to code scanning (REQ-MAT-007)
        if: always() && hashFiles('.sdd/audit/open-sdd.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .sdd/audit/open-sdd.sarif
          category: open-sdd

      - name: Report the enforcement floor
        if: always()
        run: node tools/open-sdd/dist/cli.js floor status

  # ── Windows: the non-POSIX host ───────────────────────────────────────────────────────────────
  # The commit gate ships as a portable Node hook (`templates/hooks/pre-commit`) and the CLI is
  # plain Node, so a Windows host must be able to build it and run the FULL suite. This job is the
  # proof. Nothing is weakened for Windows: no test is skipped, filtered or marked
  # `continue-on-error` here, because a suite that is green only where it is convenient proves
  # nothing. If a test is genuinely POSIX-only it fails loudly and is reported as a finding.
  #
  # Expected, pre-existing failures (reported, not hidden) — three assertions read POSIX execute
  # bits from `stat().mode`, and Windows files carry none:
  #   tools/open-sdd/test/enforcementFloor.test.ts:170
  #   tools/open-sdd/test/cliInit.test.ts:389
  #   tools/open-sdd/test/coreDoctor.test.ts:601
  # The repository already guards this class elsewhere with
  # `it.skipIf(process.platform === 'win32')` (coreDoctor.test.ts:344); these three predate that
  # guard. Fixing them belongs to whoever owns `tools/open-sdd/test/**`.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install workspace
        working-directory: tools/open-sdd
        run: npm ci

      - name: Build
        working-directory: tools/open-sdd
        run: npm run build

      - name: Test suite (full)
        working-directory: tools/open-sdd
        run: npm test

  # ── Container: one image, both architectures ──────────────────────────────────────────────────
  # Added for gap G-27. Until now the `Dockerfile` was only ever built by hand, on the author's
  # arm64 host, so no recorded amd64 image existed and a `docker run` on another architecture was
  # unverified. This job builds the image for `linux/amd64` AND `linux/arm64` with no push, and a
  # failing platform fails the job: a build that cannot run is worse than no build. It is
  # independent of the `gates` and `windows` jobs above and does not touch them.
  #
  # QEMU is what lets the amd64 runner *execute* the arm64 layers; Buildx alone selects the platform
  # but cannot run foreign binaries. Nothing is published, so this proves the Dockerfile is valid
  # for both targets without inventing a registry target the release does not have.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (foreign-architecture emulation on the runner)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image for linux/amd64 and linux/arm64 (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
